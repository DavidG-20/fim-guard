[project]
name = "fim-guard"
version = "0.1.0"
description = "Monitor de Integridad de Archivos (FIM) en Python con SHA-256 y firmas HMAC-SHA256."
readme = "README.md"
authors = [
    { name = "David Garcia Garcia", email = "davidgarcia20.academico@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
fim = "fim_guard.main:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
